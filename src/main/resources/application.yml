spring: 
  application: 
    name: nombre-de-la-pokedex 
  datasource: 
    url: jdbc:postgresql://localhost:5432/pokedex_db 
    username: postgres 
    password: password 
    driver-class-name: org.postgresql.Driver 
  jpa: 
    hibernate: 
      ddl-auto: validate
    show-sql: false 
    open-in-view: false
    defer-datasource-initialization: false
  data: 
    mongodb: 
      uri: mongodb://localhost:27017/pokedex_stats 
  flyway: 
    enabled: true 
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
 
server: 
  port: 8080 
  servlet: 
    context-path: /api 
 
app: 
  jwt: 
    secret: ${JWT_SECRET}        # Variable de entorno — nunca hardcoded 
    expiration-ms: 86400000      # 24 horas 